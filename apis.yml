    REST API that lets e-commerce merchants create Addi buy-now-pay-later credit
    applications at checkout. Authentication is handled through Auth0 using the
    OAuth2 client-credentials flow (client_id + client_secret). A sandbox
    environment is published for integration testing before going live.
