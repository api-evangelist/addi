aid: addi
name: Addi
description: >-
  Addi is a Colombian financial technology company founded in 2018 that provides
  buy-now-pay-later (BNPL) credit at the point of sale across Latin America.
  Consumers split purchases into installments using only a national ID — no credit
  card required — while merchants integrate Addi as a checkout payment method through
  first-party e-commerce plugins (VTEX IO, Magento 2, PrestaShop) and a REST API
  secured with Auth0 OAuth2 client-credentials. Addi serves more than two million
  customers and tens of thousands of merchants in Colombia and Brazil, and is
  regulated by the Superintendencia Financiera de Colombia.
